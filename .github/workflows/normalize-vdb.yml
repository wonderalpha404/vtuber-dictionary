name: Normalize VDB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vtuber-dictionary-normalization
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize VDB
        run: python -m normalizers.vdb

      - name: Commit changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normalized
          git commit -m "Normalize VDB"
          git push
