name: Process pending VTubers (batch)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "処理する件数（正の整数）"
        required: true
        default: "10"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      INPUT_COUNT: ${{ inputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install requests
        run: python -m pip install --upgrade pip && python -m pip install requests

      - name: Run batch processing
        id: run_batch
        run: |
          python scripts/process_pending.py --count "$INPUT_COUNT"

      - name: Show git status
        run: |
          echo "Git status (porcelain):"
          git status --porcelain
          echo "Diff name-only:"
          git --no-pager diff --name-only || true

      - name: Commit and push changes if only sample file changed
        run: |
          # Collect changed files (including untracked)
          CHANGED_FILES=$(git status --porcelain | cut -c4- | sed '/^$/d' | tr '\n' ' ')
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes to commit."
            exit 0
          fi
          echo "Changed files: $CHANGED_FILES"
          ALLOWED="source/sample-10-jp.json"
          for f in $CHANGED_FILES; do
            if [ "$f" != "$ALLOWED" ]; then
              echo "Aborting push: unexpected modified file: $f"
              echo "Only $ALLOWED may be changed by this workflow."
              exit 1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/sample-10-jp.json
          git commit -m "Process pending: ran research for up to ${{ inputs.count }} items" || echo "Nothing to commit"
          git push
