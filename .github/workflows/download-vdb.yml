name: Download VDB

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VDB JSON
        run: |
          curl -L "https://vdb.vtbs.moe/json/list.json" -o source/vdb.json

      - name: Commit VDB JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/vdb.json
          git diff --cached --quiet || git commit -m "Add VDB JSON"
          git push
