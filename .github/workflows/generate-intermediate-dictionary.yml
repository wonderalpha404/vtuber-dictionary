name: Generate intermediate dictionary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate intermediate dictionary
        run: python scripts/generate_intermediate_dictionary.py

      - name: Commit intermediate dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/intermediate/dictionary.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update intermediate dictionary"
            git push
          fi
