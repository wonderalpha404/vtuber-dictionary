name: Generate IME dictionary

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run IME generation
        run: |
          python scripts/generate_ime.py

      - name: Upload IME artifact
        uses: actions/upload-artifact@v4
        with:
          name: ime-dictionary
          path: ime/dictionary.tsv
