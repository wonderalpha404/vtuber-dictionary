name: Reset legacy VTuber readings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Reset legacy status=unknown records
        run: |
          python scripts/normalize_vtuber_readings.py --mode legacy

      - name: Show git status
        run: |
          git status --porcelain

      - name: Commit and push changes if needed
        run: |
          CHANGED_FILES=$(git status --porcelain | cut -c4- | sed '/^$/d' | tr '\n' ' ')

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes to commit."
            exit 0
          fi

          echo "Changed files: $CHANGED_FILES"

          ALLOWED="source/vtuber-readings.json"

          for f in $CHANGED_FILES; do
            if [ "$f" != "$ALLOWED" ]; then
              echo "Aborting push: unexpected modified file: $f"
              echo "Only $ALLOWED may be changed by this workflow."
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source/vtuber-readings.json
          git commit -m "Reset legacy unknown VTuber readings"
          git push
