name: Run Sample 10 JP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sample 10 JP
        run: python scripts/generate_sample10_jp.py

      - name: Show generated JSON
        run: cat source/sample-10-jp.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/sample-10-jp.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update JP sample data"
            git push
          fi
