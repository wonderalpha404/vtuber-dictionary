name: Run processor

on:
  workflow_dispatch:
    inputs:
      processor:
        description: "Processor name"
        required: true
        type: string
      count:
        description: "Maximum number of records to process"
        required: true
        type: number
        default: 100

permissions:
  contents: write

concurrency:
  group: vtuber-dictionary-processor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run processor
        run: python -m processors.run --processor "${{ inputs.processor }}" --count "${{ inputs.count }}"

      - name: Commit changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normalized work
          git commit -m "Run processor ${{ inputs.processor }}"
          git push
