name: Generate Microsoft IME dictionary

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Microsoft IME dictionary
        run: python scripts/generate_microsoft_ime_dictionary.py

      - name: Upload Microsoft IME dictionary
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-ime-dictionary
          path: ime/microsoft-ime/dictionary.txt
