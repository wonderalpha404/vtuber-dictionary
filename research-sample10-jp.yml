name: Research Pending JP VTubers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Research pending JP VTubers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/research_pending_jp.py

      - name: Show research results
        run: cat source/sample-10-jp.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/sample-10-jp.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Research pending JP VTubers"
            git push
          fi
